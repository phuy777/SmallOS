name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes grub-pc-bin grub-common xorriso mtools \
            qemu-system-x86 gdb zip

      - name: Build kernel and bootable ISO
        run: make CC=gcc iso

      - name: Verify Multiboot2 kernel
        run: grub-file --is-x86-multiboot2 build/kernel.elf

      - name: Smoke-test ISO boot
        run: |
          set -eu
          qemu-system-x86_64 \
            -machine pc -m 128M -cdrom build/smallos.iso \
            -display none -serial none -monitor none \
            -no-reboot -no-shutdown -S -gdb tcp:127.0.0.1:12347 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT
          sleep 1
          timeout 20s gdb -q -batch build/kernel.elf \
            -ex 'set debuginfod enabled off' \
            -ex 'target remote 127.0.0.1:12347' \
            -ex 'hbreak kmain' \
            -ex 'continue' \
            -ex 'printf "Reached kmain successfully\n"' \
            -ex 'set confirm off' \
            -ex 'detach'

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p release-assets
          cp build/smallos.iso "release-assets/smallos-${RELEASE_TAG}.iso"
          cp build/kernel.elf "release-assets/kernel-${RELEASE_TAG}.elf"
          {
            printf 'LeptoOS %s\n' "$RELEASE_TAG"
            printf 'Commit: %s\n' "$COMMIT_SHA"
            printf 'Bootable image: smallos-%s.iso\n' "$RELEASE_TAG"
            printf 'Kernel ELF: kernel-%s.elf\n' "$RELEASE_TAG"
          } > release-assets/BUILD-INFO.txt
          (
            cd release-assets
            zip "smallos-${RELEASE_TAG}-artifacts.zip" \
              "smallos-${RELEASE_TAG}.iso" \
              "kernel-${RELEASE_TAG}.elf" \
              BUILD-INFO.txt
            sha256sum ./*.iso ./*.elf ./*.zip > SHA256SUMS
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
